<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Convertidor HTML a APK/EXE</title>
<style>
:root{--bg:#f5f6f8;--fg:#1c1e21;--card:#fff;--ac:#2563eb;--bd:#d9dce1}
@media(prefers-color-scheme:dark){:root{--bg:#15171a;--fg:#e8eaed;--card:#1f2226;--bd:#363a40}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:22px}fieldset{background:var(--card);border:1px solid var(--bd);border-radius:10px;margin:12px 0;padding:12px 16px}
legend{font-weight:600;padding:0 6px}label{display:block;margin:8px 0 2px;font-size:13px;opacity:.85}
input[type=text],input[type=number],select{width:100%;padding:7px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg);box-sizing:border-box}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.chk label{display:inline-flex;gap:5px;align-items:center;margin:6px 14px 0 0;font-size:14px;opacity:1}
.tabs{display:flex;gap:8px}.tabs button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:8px;cursor:pointer;font-weight:600}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#go{width:100%;padding:13px;font-size:16px;background:var(--ac);color:#fff;border:0;border-radius:8px;cursor:pointer;margin-top:6px}
#msg{margin-top:12px;padding:10px;border-radius:8px;display:none;white-space:pre-wrap}.ok{background:#16a34a22}.err{background:#dc262622}
.full{display:none}body.completa .full{display:block}body.completa .row.full{display:grid}
.sec{padding:9px 12px;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:8px;cursor:pointer}
.btn2{padding:10px 14px;margin:6px 6px 0 0;border:0;border-radius:8px;background:var(--ac);color:#fff;font-size:14px}
#crop{position:fixed;inset:0;background:#000d;display:none;z-index:9;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:16px}
#crop canvas{width:min(80vw,340px);height:min(80vw,340px);background:repeating-conic-gradient(#888 0 25%,#aaa 0 50%) 0 0/20px 20px;border-radius:12px;touch-action:none}
#crop input[type=range]{width:min(80vw,340px)}#crop .b{display:flex;gap:10px}#crop p{color:#fff;margin:0;font-size:13px;text-align:center}
</style></head><body class="minima"><main>
<h1>HTML → APK / EXE</h1>
<div class="tabs"><button id="tMin" class="on">MINIMA</button><button id="tFull">COMPLETA</button></div>

<fieldset><legend>Tu HTML</legend>
<div style="display:flex;gap:8px;flex-wrap:wrap">
<button type="button" class="sec" onclick="H2A.pickFiles()">Elegir archivo(s) HTML</button>
<button type="button" class="sec" onclick="H2A.pickFolder()">Elegir carpeta de la web</button>
<button type="button" class="sec" onclick="H2A.pickIcon()">Icono desde una imagen</button></div>
<div id="fInfo" style="margin-top:8px;font-size:13px">Aún no elegiste nada.</div>
<div id="iconInfo" style="font-size:13px"></div>
</fieldset>

<fieldset><legend>Generador de icono (escribe una palabra clave)</legend>
<div style="display:flex;gap:8px"><input type="text" id="kw" placeholder="ej: musica, juego, tienda, clima, foto…"><button id="kwGo" type="button" style="padding:7px 14px">Generar</button></div>
<div id="icons" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px"></div>
<div style="font-size:12px;opacity:.7;margin-top:6px">Toca una variante para usarla como icono. Si subes un PNG propio, ese tiene prioridad.</div>
</fieldset>

<fieldset><legend>Básico</legend>
<label>Nombre de la app</label><input type="text" id="name" value="MiApp">
<label>Orientación</label><select id="orientation"><option value="unspecified">Ambas (gira con el celular)</option><option value="portrait">Solo vertical</option><option value="landscape">Solo horizontal</option><option value="sensor">Ambas aunque la rotación esté bloqueada</option></select>
<div class="chk"><label><input type="checkbox" id="tApk" checked> Android (APK)</label><label><input type="checkbox" id="tExe" checked> Windows (EXE)</label></div>
</fieldset>

<div class="full">
<fieldset><legend>Identidad</legend><div class="row">
<div><label>ID del paquete</label><input type="text" id="packageId" placeholder="com.miempresa.miapp"></div>
<div><label>Autor</label><input type="text" id="author"></div>
<div><label>Versión</label><input type="text" id="version" value="1.0.0"></div>
<div><label>Código de versión (Android)</label><input type="number" id="versionCode" value="1"></div></div>
<label>Descripción</label><input type="text" id="description"></fieldset>

<fieldset><legend>Android</legend><div class="row">

<div><label>Duración splash (ms)</label><input type="number" id="splashDuration" value="1500"></div>
<div><label>Color splash</label><input type="text" id="splashColor" value="#ffffff"></div>
<div><label>Color barra de estado</label><input type="text" id="statusBarColor" value="#000000"></div>
<div><label>SDK mínimo</label><input type="number" id="minSdk" value="22"></div>
<div><label>SDK objetivo</label><input type="number" id="targetSdk" value="34"></div></div>
<div class="chk"><label><input type="checkbox" id="fullscreen"> Pantalla completa</label><label><input type="checkbox" id="allowCleartext"> Permitir http (sin https)</label><label><input type="checkbox" id="keepAwake"> Mantener pantalla encendida</label><label><input type="checkbox" id="askOnStart" checked> Pedir permisos al abrir tras instalar</label></div>
<label>Permisos</label><div class="chk" id="perms"><label><input type="checkbox" id="allPerms"><b>Marcar todos</b></label><label><input type="checkbox" value="camera">Cámara</label><label><input type="checkbox" value="microphone">Micrófono</label><label><input type="checkbox" value="location">Ubicación precisa</label><label><input type="checkbox" value="coarseLocation">Ubicación aproximada</label><label><input type="checkbox" value="backgroundLocation">Ubicación en segundo plano</label><label><input type="checkbox" value="storage">Leer almacenamiento</label><label><input type="checkbox" value="writeStorage">Escribir almacenamiento</label><label><input type="checkbox" value="manageStorage">Todos los archivos</label><label><input type="checkbox" value="images">Fotos</label><label><input type="checkbox" value="videos">Videos</label><label><input type="checkbox" value="audio">Audio/música</label><label><input type="checkbox" value="notifications">Notificaciones</label><label><input type="checkbox" value="contacts">Leer contactos</label><label><input type="checkbox" value="writeContacts">Editar contactos</label><label><input type="checkbox" value="calendar">Leer calendario</label><label><input type="checkbox" value="writeCalendar">Editar calendario</label><label><input type="checkbox" value="phone">Estado del teléfono</label><label><input type="checkbox" value="callPhone">Hacer llamadas</label><label><input type="checkbox" value="callLog">Registro de llamadas</label><label><input type="checkbox" value="sms">Leer SMS</label><label><input type="checkbox" value="sendSms">Enviar SMS</label><label><input type="checkbox" value="receiveSms">Recibir SMS</label><label><input type="checkbox" value="bodySensors">Sensores corporales</label><label><input type="checkbox" value="activityRecognition">Actividad física</label><label><input type="checkbox" value="bluetooth">Bluetooth</label><label><input type="checkbox" value="bluetoothConnect">Conectar Bluetooth</label><label><input type="checkbox" value="bluetoothScan">Buscar Bluetooth</label><label><input type="checkbox" value="nearbyWifi">Wi-Fi cercano</label><label><input type="checkbox" value="wifiState">Estado Wi-Fi</label><label><input type="checkbox" value="networkState">Estado de red</label><label><input type="checkbox" value="changeWifi">Cambiar Wi-Fi</label><label><input type="checkbox" value="nfc">NFC</label><label><input type="checkbox" value="vibrate">Vibración</label><label><input type="checkbox" value="wakeLock">Mantener activo</label><label><input type="checkbox" value="bootCompleted">Iniciar con el sistema</label><label><input type="checkbox" value="foregroundService">Servicio en primer plano</label><label><input type="checkbox" value="overlay">Mostrar sobre otras apps</label><label><input type="checkbox" value="flashlight">Linterna</label><label><input type="checkbox" value="biometric">Huella/biometría</label><label><input type="checkbox" value="installPackages">Instalar paquetes</label><label><input type="checkbox" value="accounts">Cuentas</label><label><input type="checkbox" value="modifyAudio">Ajustes de audio</label><label><input type="checkbox" value="exactAlarm">Alarmas exactas</label></div></fieldset>

<fieldset><legend>Windows</legend><div class="row">
<div><label>Ancho</label><input type="number" id="width" value="1000"></div><div><label>Alto</label><input type="number" id="height" value="700"></div>
<div><label>Ancho mínimo</label><input type="number" id="minWidth" value="0"></div><div><label>Alto mínimo</label><input type="number" id="minHeight" value="0"></div>
<div><label>Color de fondo</label><input type="text" id="backgroundColor" value="#ffffff"></div>
<div><label>Tipo</label><select id="installer"><option value="nsis">Instalador</option><option value="portable">Portable</option></select></div></div>
<div class="chk"><label><input type="checkbox" id="resizable" checked> Redimensionable</label><label><input type="checkbox" id="frame" checked> Marco de ventana</label><label><input type="checkbox" id="exeFullscreen"> Pantalla completa</label><label><input type="checkbox" id="maximized"> Maximizada</label><label><input type="checkbox" id="alwaysOnTop"> Siempre encima</label><label><input type="checkbox" id="hideMenu" checked> Ocultar menú</label><label><input type="checkbox" id="devTools"> Herramientas de desarrollo</label><label><input type="checkbox" id="singleInstance" checked> Una sola instancia</label><label><input type="checkbox" id="autoGrantWeb" checked> Conceder cámara/micrófono/ubicación sin preguntar</label></div></fieldset>
</div>

<div id="crop"><p>Arrastra para mover y usa el control para acercar. Se recorta en 1:1.</p><canvas id="cc" width="600" height="600"></canvas>
<input type="range" id="zoom" min="1" max="4" step="0.01" value="1"><div class="b"><button class="btn2" id="cOk">Usar recorte</button><button class="btn2" id="cNo" style="background:#6b7280">Cancelar</button></div></div>
<button id="go">Convertir</button><div id="msg"></div></main>
<script>
const $=id=>document.getElementById(id);
function mode(m){document.body.className=m;$('tMin').classList.toggle('on',m=='minima');$('tFull').classList.toggle('on',m=='completa')}
$('tMin').onclick=()=>mode('minima');$('tFull').onclick=()=>mode('completa');
const b64=f=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result.split(',')[1]);x.readAsDataURL(f)});

const GLY={musica:'🎵',music:'🎵',juego:'🎮',game:'🎮',tienda:'🛒',shop:'🛒',clima:'⛅',weather:'⛅',foto:'📷',camara:'📷',photo:'📷',chat:'💬',mensaje:'💬',mapa:'🗺️',map:'🗺️',salud:'❤️',health:'❤️',comida:'🍔',food:'🍔',receta:'🍳',libro:'📚',book:'📚',escuela:'🎓',school:'🎓',dinero:'💰',money:'💰',banco:'🏦',calculadora:'🧮',notas:'📝',note:'📝',tareas:'✅',todo:'✅',reloj:'⏰',clock:'⏰',calendario:'📅',calendar:'📅',video:'🎬',cine:'🎬',radio:'📻',viaje:'✈️',travel:'✈️',coche:'🚗',car:'🚗',deporte:'⚽',sport:'⚽',gym:'🏋️',fitness:'🏋️',mascota:'🐶',perro:'🐶',gato:'🐱',cat:'🐱',dog:'🐶',casa:'🏠',home:'🏠',trabajo:'💼',work:'💼',correo:'✉️',email:'✉️',seguridad:'🔒',lock:'🔒',luz:'💡',idea:'💡',cohete:'🚀',rocket:'🚀',estrella:'⭐',star:'⭐',fuego:'🔥',fire:'🔥',planta:'🌱',naturaleza:'🌿',cafe:'☕',coffee:'☕',pizza:'🍕',arte:'🎨',art:'🎨',dibujo:'🎨',herramientas:'🔧',tools:'🔧',codigo:'💻',code:'💻',web:'🌐',internet:'🌐',robot:'🤖',ia:'🤖',ai:'🤖',noticias:'📰',news:'📰',regalo:'🎁',gift:'🎁',amor:'💖',love:'💖',tiempo:'⏳',quiz:'❓',trivia:'❓',dado:'🎲',dice:'🎲',ajedrez:'♟️',chess:'♟️'};
const PAL=[['#6366f1','#8b5cf6'],['#f97316','#ef4444'],['#10b981','#06b6d4'],['#ec4899','#f43f5e'],['#0ea5e9','#2563eb'],['#facc15','#f97316'],['#1f2937','#4b5563'],['#14b8a6','#22c55e']];
const norm=t=>t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
function hash(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h}
let iconB64=null;
function draw(cv,glyph,pal,shape){
  const c=cv.getContext('2d'),S=cv.width;c.clearRect(0,0,S,S);
  const g=c.createLinearGradient(0,0,S,S);g.addColorStop(0,pal[0]);g.addColorStop(1,pal[1]);c.fillStyle=g;
  c.beginPath();
  if(shape==='circle')c.arc(S/2,S/2,S/2,0,7);else if(shape==='square')c.rect(0,0,S,S);else c.roundRect(0,0,S,S,S*.22);
  c.fill();c.textAlign='center';c.textBaseline='middle';c.fillStyle='#fff';
  const letter=/^[A-Za-z0-9]/.test(glyph);
  c.font=(letter?'bold '+S*.55+'px system-ui,sans-serif':S*.55+'px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif');
  c.fillText(glyph,S/2,S/2+S*.03);
}
$('kwGo').onclick=()=>{
  const k=norm($('kw').value);if(!k)return;
  const key=Object.keys(GLY).find(x=>k===norm(x))||Object.keys(GLY).find(x=>k.includes(norm(x))||norm(x).includes(k)&&k.length>2);
  const glyph=key?GLY[key]:k.slice(0,2).replace(/^./,c=>c.toUpperCase());
  const box=$('icons');box.innerHTML='';const h=hash(k);
  ['rounded','circle','square','rounded','circle','square'].forEach((shape,i)=>{
    const cv=document.createElement('canvas');cv.width=cv.height=1024;cv.style.cssText='width:84px;height:84px;cursor:pointer;border:3px solid transparent;border-radius:12px';
    draw(cv,glyph,PAL[(h+i*3)%PAL.length],shape);
    cv.onclick=()=>{[...box.children].forEach(x=>x.style.borderColor='transparent');cv.style.borderColor='#2563eb';iconB64=cv.toDataURL('image/png').split(',')[1];H2A.setIcon(iconB64);$('iconInfo').textContent='Icono generado seleccionado'};
    box.appendChild(cv);
  });
  box.firstChild.click();
};
$('allPerms').onchange=e=>document.querySelectorAll('#perms input[value]').forEach(i=>i.checked=e.target.checked);
function onFiles(r){$('fInfo').textContent=r.count+' archivo(s) listos. Página principal: '+(r.entry||'(no hay .html)')}
function onIcon(){$('iconInfo').textContent='Icono desde una imagen cargado'}
function onResult(txt){
  const r=JSON.parse(txt),m=$('msg');m.style.display='block';$('go').disabled=false;
  if(!r.ok){m.className='err';m.textContent='Error: '+r.error;return}
  m.className='ok';m.innerHTML='';
  const t=document.createElement('div');t.textContent='Listo.'+(r.apkPublic?' APK en '+r.apkPublic:'')+(r.zipPublic?'\nProyecto Windows en '+r.zipPublic:'');t.style.whiteSpace='pre-wrap';m.appendChild(t);
  const add=(txt,fn)=>{const b=document.createElement('button');b.className='btn2';b.textContent=txt;b.onclick=fn;m.appendChild(b)};
  if(r.apk){add('Instalar APK',()=>H2A.install(r.apk));add('Compartir APK',()=>H2A.share(r.apk))}
  if(r.zip)add('Compartir proyecto Windows (ZIP)',()=>H2A.share(r.zip));
}

// ---- Recorte 1:1 de imagen para el icono ----
let cImg=null,cx=0,cy=0,cs=1,base=1;
const cc=$('cc'),cctx=cc.getContext('2d');
function cDraw(){cctx.clearRect(0,0,600,600);if(!cImg)return;const sc=base*cs,w=cImg.width*sc,h=cImg.height*sc;
  cx=Math.min(Math.max(cx,600-w>0?(600-w)/2:600-w),600-w>0?(600-w)/2:0);cy=Math.min(Math.max(cy,600-h>0?(600-h)/2:600-h),600-h>0?(600-h)/2:0);
  cctx.drawImage(cImg,cx,cy,w,h)}
function onIconImage(b64){
  const im=new Image();im.onload=()=>{cImg=im;base=Math.max(600/im.width,600/im.height);cs=1;$('zoom').value=1;
    cx=(600-im.width*base)/2;cy=(600-im.height*base)/2;$('crop').style.display='flex';cDraw()};
  im.onerror=()=>{$('iconInfo').textContent='No se pudo abrir esa imagen'};im.src='data:image/png;base64,'+b64}
$('zoom').oninput=e=>{const n=+e.target.value,k=n/cs;cx=300-(300-cx)*k;cy=300-(300-cy)*k;cs=n;cDraw()};
let drag=null;
cc.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY};cc.setPointerCapture(e.pointerId)};
cc.onpointermove=e=>{if(!drag)return;const r=600/cc.clientWidth;cx+=(e.clientX-drag.x)*r;cy+=(e.clientY-drag.y)*r;drag={x:e.clientX,y:e.clientY};cDraw()};
cc.onpointerup=()=>drag=null;
$('cNo').onclick=()=>{$('crop').style.display='none'};
$('cOk').onclick=()=>{const o=document.createElement('canvas');o.width=o.height=1024;const k=1024/600,sc=base*cs;
  o.getContext('2d').drawImage(cImg,cx*k,cy*k,cImg.width*sc*k,cImg.height*sc*k);
  const b=o.toDataURL('image/png').split(',')[1];H2A.setIcon(b);iconB64=b;
  $('iconInfo').innerHTML='Icono recortado listo <img src="data:image/png;base64,'+b+'" width="40" style="vertical-align:middle;border-radius:8px">';
  $('crop').style.display='none'};
$('go').onclick=()=>{
  const m=$('msg');m.style.display='block';m.className='';m.textContent='Generando…';$('go').disabled=true;
  const full=document.body.classList.contains('completa');
  const o={mode:full?'completa':'minima',orientation:$('orientation').value,name:$('name').value||'MiApp',targets:[$('tApk').checked&&'apk',$('tExe').checked&&'exe'].filter(Boolean)};
  if(full){
    for(const id of ['packageId','author','version','description','splashColor','statusBarColor','backgroundColor','installer'])o[id]=$(id).value;
    for(const id of ['versionCode','splashDuration','minSdk','targetSdk','width','height','minWidth','minHeight'])o[id]=+$(id).value;
    for(const id of ['fullscreen','allowCleartext','keepAwake','askOnStart','autoGrantWeb','resizable','frame','exeFullscreen','maximized','alwaysOnTop','hideMenu','devTools','singleInstance'])o[id]=$(id).checked;
    o.permissions=[...document.querySelectorAll('#perms input[value]:checked')].map(i=>i.value);
  }
  H2A.generate(JSON.stringify({options:o}));
};
</script></body></html>

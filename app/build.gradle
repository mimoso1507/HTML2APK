plugins { id 'com.android.application' }
android {
    namespace 'com.h2a.converter'
    compileSdk 34
    defaultConfig {
        applicationId 'com.h2a.converter'
        minSdk 26
        targetSdk 34
        versionCode (project.findProperty('vcode') ?: 1).toInteger()
        versionName '1.' + (project.findProperty('vcode') ?: 1)
    }
    signingConfigs {
        debug {
            storeFile file('src/main/assets/h2a.p12')
            storePassword 'h2apass'
            keyAlias 'h2a'
            keyPassword 'h2apass'
            storeType 'pkcs12'
            enableV1Signing = true
            enableV2Signing = true
            enableV3Signing = true
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError false }
}
dependencies {
    implementation 'com.android.tools.build:apksig:8.5.2'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.core:core:1.13.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
